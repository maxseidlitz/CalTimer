services:
  caltimer:
    build: .
    image: caltimer:latest
    container_name: caltimer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
      # Eigene Hostnamen erlauben, falls du nicht per IP zugreifst:
      # - ALLOWED_HOSTS=zimaboard.fritz.box
      # - DEMO=1   # Beispieltermine statt iCloud
    volumes:
      - caltimer-data:/data
      # Alternativ ein Ordner auf dem ZimaBoard (vorher: sudo chown 1000:1000 <ordner>):
      # - /DATA/AppData/caltimer:/data

    # Härtung: Container darf nur nach /data schreiben und hat keine Sonderrechte.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m

volumes:
  caltimer-data:
